plugins {
    id('com.android.library') version '7.1.1'
    id 'org.jetbrains.kotlin.android' version '1.7.20'
    id ('maven-publish')
}

ext.kotlin_version = '1.7.20'
project.buildDir = 'dist_android'

repositories {
    mavenCentral()
    google()
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2022.10.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
}

task cleanFilteredSources(type: Delete) {
    delete 'dist/android-filtered'
}

// Filter the output tokens files so we only include base/dp/tmo
task stageFilteredJavaSources(type: Copy) {
    dependsOn cleanFilteredSources
    from('dist/android/java') {
        include 'tokens-base-light.kt', 'tokens-base-dark.kt',
            'tokens-dp-light.kt', 'tokens-dp-dark.kt',
            'tokens-tmo-light.kt', 'tokens-tmo-dark.kt'
    }
    into 'dist/android-filtered/java'
}

task stageFilteredResources(type: Copy) {
    dependsOn cleanFilteredSources
    from('dist/android/res') {
        include 'values/colors-base-light.xml', 'values/colors-base-dark.xml',
            'values/colors-dp-light.xml', 'values/colors-dp-dark.xml',
            'values/colors-tmo-light.xml', 'values/colors-tmo-dark.xml',
            'values/dimens-base.xml', 'values/dimens-theme.xml'
    }
    into 'dist/android-filtered/res'
}

android {
    sourceSets {
        main {
            java.srcDirs = ['dist/android-filtered/java']
            res.srcDirs = ['dist/android-filtered/res']
            manifest.srcFile 'dist/android/AndroidManifest.xml'
        }
    }
}

preBuild.dependsOn stageFilteredJavaSources, stageFilteredResources


task androidSourcesJar(type: Jar) {
    dependsOn stageFilteredJavaSources
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}

task setProperties(type: WriteProperties) {
    outputFile = file('gradle.properties')
    property 'android.useAndroidX', true
    property 'version', version
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                // sources
                artifact androidSourcesJar

                groupId = 'dialtone.dialpad'


                pom {
                    name = 'Dialtone Tokens'
                    description = "Design tokens for Dialpad's design system, Dialtone."
                    url = 'https://dialtone.dialpad.com/tokens/'

                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://github.com/dialpad/dialtone/blob/staging/LICENSE'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/dialpad/dialtone.git'
                        developerConnection = 'scm:git:ssh://github.com/dialpad/dialtone.git'
                        url = 'https//github.com/dialpad/dialtone'
                    }

                }
            }
        }
        repositories {
            maven {
                name = "Dialtone Tokens Maven Packages"
                url = uri("https://maven.pkg.github.com/dialpad/dialtone")
                credentials {
                    username = project.findProperty("release.user") ?: System.getenv("GITHUB_USER")
                    password = project.findProperty("release.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}

artifacts {
    archives androidSourcesJar
}

android {
    compileSdkVersion 31
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName '1.0'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = "1.3.2"
    }
}
