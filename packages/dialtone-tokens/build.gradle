plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.kotlinAndroid)
    alias(libs.plugins.kotlinComposeCompiler)
    id ('maven-publish')
}

ext.kotlin_version = libs.versions.kotlin.get()
project.buildDir = 'dist_android'

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation platform(libs.composeBom)
    implementation libs.composeUi
}

android {
    namespace 'dialtone.dialpad.tokens'
    compileSdkVersion libs.versions.androidCompileSdk.get().toInteger()
    sourceSets {
        main {
            java.srcDirs = ['dist/android/java']
            res.srcDirs = ['dist/android/res']
            manifest.srcFile 'dist/android/AndroidManifest.xml'
        }
    }
    defaultConfig {
        minSdkVersion libs.versions.androidMinSdk.get().toInteger()
        targetSdkVersion libs.versions.androidTargetSdk.get().toInteger()
        versionCode 1
        versionName '1.0'
    }
    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}


task setProperties(type: WriteProperties) {
    destinationFile = file('gradle.properties')
    property 'android.useAndroidX', true
    property 'version', version
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release

                groupId = 'dialtone.dialpad'


                pom {
                    name = 'Dialtone Tokens'
                    description = "Design tokens for Dialpad's design system, Dialtone."
                    url = 'https://dialtone.dialpad.com/tokens/'

                    licenses {
                        license {
                            name = 'MIT'
                            url = 'https://github.com/dialpad/dialtone/blob/staging/LICENSE'
                        }
                    }

                    scm {
                        connection = 'scm:git:git://github.com/dialpad/dialtone.git'
                        developerConnection = 'scm:git:ssh://github.com/dialpad/dialtone.git'
                        url = 'https//github.com/dialpad/dialtone'
                    }

                }
            }
        }
        repositories {
            maven {
                name = "Dialtone Tokens Maven Packages"
                url = uri("https://maven.pkg.github.com/dialpad/dialtone")
                credentials {
                    username = project.findProperty("release.user") ?: System.getenv("GITHUB_USER")
                    password = project.findProperty("release.key") ?: System.getenv("GITHUB_TOKEN")
                }
            }
        }
    }
}
