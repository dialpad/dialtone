<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px -apple-system, sans-serif; margin: 0; padding: 12px; color: #1c1c1c; }
  button { inline-size: 100%; padding: 8px; margin-block-end: 8px; cursor: pointer; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; }
  .ok { color: #0a7c2f; }
  .err { color: #c0392b; }
</style>
</head>
<body>
  <button id="run">Sync text styles</button>
  <div id="log">Fetches the spec from the local dev server (run <code>pnpm sync:styles:serve</code> first), then builds every text style in this file.</div>
  <script>
    const log = document.getElementById('log');
    const button = document.getElementById('run');
    const SPEC_URL = 'http://localhost:4577/text-styles.json';

    button.onclick = async () => {
      button.disabled = true;
      log.textContent = 'Fetching spec…';
      try {
        const res = await fetch(SPEC_URL);
        if (!res.ok) throw new Error(`dev server responded ${res.status}`);
        const specs = await res.json();
        log.textContent = `Fetched ${specs.length} specs. Creating styles…`;
        parent.postMessage({ pluginMessage: { type: 'run-text-styles', specs } }, '*');
      } catch (e) {
        log.textContent = `Could not reach the dev server: ${e.message}`;
        log.className = 'err';
        button.disabled = false;
      }
    };

    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      button.disabled = false;
      if (msg.type === 'result') {
        const { created, updated, errors, totalStyles } = msg.result;
        log.className = errors.length ? 'err' : 'ok';
        log.textContent =
          `created ${created.length}, updated ${updated.length}, errors ${errors.length}\n` +
          `total text styles in file: ${totalStyles}\n\n` +
          (errors.length ? errors.map(e => `${e.name}: ${e.error}`).join('\n') : 'All clean.');
      } else if (msg.type === 'error') {
        log.className = 'err';
        log.textContent = msg.error;
      }
    };
  </script>
</body>
</html>
