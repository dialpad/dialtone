<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 12px -apple-system, sans-serif; margin: 0; padding: 12px; color: #1c1c1c; }
  button { inline-size: 100%; padding: 8px; margin-block-end: 8px; cursor: pointer; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 11px; line-height: 1.5; }
  .ok { color: #0a7c2f; }
  .err { color: #c0392b; }
</style>
</head>
<body>
  <button id="run-text" data-type="run-text-styles" data-url="text-styles.json">Sync text styles</button>
  <button id="run-effect" data-type="run-effect-styles" data-url="effect-styles.json">Sync effect styles</button>
  <button id="run-paint" data-type="run-paint-styles" data-url="paint-styles.json">Sync paint styles</button>
  <div id="log">Fetches each spec from the local dev server (run <code>pnpm sync:styles:serve</code> first), then builds every style of that kind in this file.</div>
  <script>
    const log = document.getElementById('log');
    const buttons = [document.getElementById('run-text'), document.getElementById('run-effect'), document.getElementById('run-paint')];
    const BASE_URL = 'http://localhost:4577/';

    for (const button of buttons) {
      button.onclick = async () => {
        for (const b of buttons) b.disabled = true;
        log.textContent = 'Fetching spec…';
        try {
          const res = await fetch(BASE_URL + button.dataset.url);
          if (!res.ok) throw new Error(`dev server responded ${res.status}`);
          const specs = await res.json();
          log.textContent = `Fetched ${specs.length} specs. Creating styles…`;
          parent.postMessage({ pluginMessage: { type: button.dataset.type, specs } }, '*');
        } catch (e) {
          log.textContent = `Could not reach the dev server: ${e.message}`;
          log.className = 'err';
          for (const b of buttons) b.disabled = false;
        }
      };
    }

    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;
      for (const b of buttons) b.disabled = false;
      if (msg.type === 'result') {
        const { created, updated, errors, totalStyles } = msg.result;
        log.className = errors.length ? 'err' : 'ok';
        log.textContent =
          `created ${created.length}, updated ${updated.length}, errors ${errors.length}\n` +
          `total styles of this kind in file: ${totalStyles}\n\n` +
          (errors.length ? errors.map(e => `${e.name}: ${e.error}`).join('\n') : 'All clean.');
      } else if (msg.type === 'error') {
        log.className = 'err';
        log.textContent = msg.error;
      }
    };
  </script>
</body>
</html>
