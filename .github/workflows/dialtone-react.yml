# CI for packages/dialtone-react, on PRs into and pushes to the dialtone-react branch (the Vue → React port).
#   check: lint, typecheck, test and build the package, and run the harness's own tests.
#   gate:  the parity gate for every ported unit the change touches (parity/changed-units.mjs): its React directory,
#          any of its Vue sources, or a shared file, which gates them all.
name: dialtone-react

on:
  pull_request:
    branches:
      - dialtone-react
    paths:
      - 'packages/dialtone-react/**'
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-icons/**'
      - 'packages/dialtone-emojis/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/src/variants/**'
      - 'packages/combinator/src/lib/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'nx.json'
      - '.github/actions/setup-environment/**'
      - '.github/workflows/dialtone-react.yml'
  push:
    branches:
      - dialtone-react
    paths:
      - 'packages/dialtone-react/**'
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-icons/**'
      - 'packages/dialtone-emojis/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/src/variants/**'
      - 'packages/combinator/src/lib/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'nx.json'
      - '.github/actions/setup-environment/**'
      - '.github/workflows/dialtone-react.yml'

permissions:
  contents: read
  packages: read

# A PR's newer push cancels its older run. Each push to dialtone-react runs in its own group instead: the gate diffs
# only that push's range, so a cancelled run (or a pending one a newer push replaced) would leave units ungated.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUSKY: 0
  # Both jobs restore .nx/cache from actions/cache, and another runner wrote it. Nx otherwise rejects such an entry
  # ("Invalid Cache Directory ... was not generated on this machine") and fails the step after its task succeeded.
  NX_REJECT_UNKNOWN_LOCAL_CACHE: '0'

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-environment

      # Nx's local cache: dialtone-icons and dialtone-tokens builds, which every target here depends on.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-dialtone-react-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-dialtone-react-check-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint
        run: pnpm nx run dialtone-react:lint

      - name: Typecheck
        run: pnpm nx run dialtone-react:typecheck

      - name: Test
        run: pnpm nx run dialtone-react:test

      # The harness's own tests (Node's runner): which units CI gates for a change.
      - name: Harness tests
        run: node --test 'packages/dialtone-react/parity/*.test.mjs'

      - name: Build
        run: pnpm nx run dialtone-react:build

  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # A PR is checked out as its merge commit, whose first parent is the base: depth 2 is enough to diff them.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Changed units
        id: units
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # --no-renames: a rename lists only its new path, and its old one can belong to another unit. The base is
          # what parity/extra-cases.mjs is compared with, so a change to it gates only the units whose cases changed.
          list_units () { CHANGED_UNITS_BASE="$1" node packages/dialtone-react/parity/changed-units.mjs; }
          if [[ $EVENT == pull_request ]]; then
            units=$(git diff --no-renames --name-only HEAD^1 HEAD | list_units HEAD^1)
          elif [[ $BEFORE =~ ^0+$ ]] || ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            # A new branch, or a history rewrite: every ported unit, which a shared path selects (components/ and
            # common/ ones alike).
            units=$(echo packages/dialtone-react/package.json | list_units)
          else
            units=$(git diff --no-renames --name-only "$BEFORE" HEAD | list_units "$BEFORE")
          fi
          echo "Units: ${units:-none}"
          # One line for GITHUB_OUTPUT. An empty list stays empty, so the steps below skip.
          echo "list=${units//$'\n'/ }" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-environment
        if: steps.units.outputs.list != ''

      - uses: actions/cache@v4
        if: steps.units.outputs.list != ''
        with:
          path: .nx/cache
          key: nx-dialtone-react-gate-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: nx-dialtone-react-gate-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # One unit after another (15-50s each), every one reported even when an earlier one fails. On dialtone-react
      # itself, stand-ins for a component that just merged don't fail: follow-up PRs swap the component in. The check
      # job typechecks the whole package, so no unit's gate repeats it.
      # A unit that fails is gated again on the base (the PR's base, or the commit before a push) in a second checkout.
      # What fails there too, line for line (parity/new-failures.mjs), was failing already, like a unit a staging sync
      # left stale until its resync merges: it's reported, and doesn't fail this run. Anything new does, and so does
      # every failure when there's no base to compare with.
      - name: Parity gate
        if: steps.units.outputs.list != ''
        env:
          UNITS: ${{ steps.units.outputs.list }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PARITY_SKIP_STAND_INS: ${{ github.event_name == 'push' && '1' || '0' }}
          PARITY_SKIP_TYPECHECK: '1'
          PARITY_TMP: ${{ runner.temp }}
        run: |
          failed=()
          for unit in $UNITS; do
            log="$RUNNER_TEMP/gate-$unit.log"
            pnpm nx run dialtone-react:gate -- "$unit" | tee "$log" || failed+=("$unit")
            sed -n '/^#### Parity gate/,$p' "$log" >> "$GITHUB_STEP_SUMMARY"
          done
          (( ${#failed[@]} )) || exit 0

          if [[ $EVENT == pull_request ]]; then base=HEAD^1; else base=$BEFORE; fi
          worktree="$RUNNER_TEMP/base"
          if [[ -z $base || $base =~ ^0+$ ]] || ! git worktree add --detach "$worktree" "$base" \
            || ! (cd "$worktree" && pnpm install --frozen-lockfile --prefer-offline); then
            echo "::error::No base to compare with, so every failure counts: ${failed[*]}"
            exit 1
          fi
          new=()
          old=()
          for unit in "${failed[@]}"; do
            # A unit whose own files the change touches has to pass outright: its port, resync, swap or fix can't
            # lean on the base, or a half-done one would pass and stay green from then on.
            dir=$(node --input-type=module -e \
              "const { reactDir } = await import('./packages/dialtone-react/parity/vue-sources.mjs'); console.log(reactDir(process.argv[1]))" "$unit")
            if [[ -z $dir ]] || ! git diff --quiet "$base" HEAD -- "packages/dialtone-react/$dir"; then
              new+=("$unit")
              echo "$unit changes its own files here, so all its failures count" | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            # Standard output only, as tee keeps above, so both logs hold the same kind of lines.
            (cd "$worktree" && pnpm nx run dialtone-react:gate -- "$unit") \
              > "$RUNNER_TEMP/base-gate-$unit.log" 2> "$RUNNER_TEMP/base-gate-$unit.err" || true
            echo "Compared with the base: $unit"
            if node packages/dialtone-react/parity/new-failures.mjs "$RUNNER_TEMP/gate-$unit.log" \
              "$RUNNER_TEMP/base-gate-$unit.log" "$PWD" "$worktree" | tee "$RUNNER_TEMP/new-$unit.md"; then
              old+=("$unit")
            else
              new+=("$unit")
              if ! grep -q '^#### Parity gate' "$RUNNER_TEMP/base-gate-$unit.log"; then
                echo "The base's gate for $unit printed no summary. How it ended:"
                tail -n 20 "$RUNNER_TEMP/base-gate-$unit.log" "$RUNNER_TEMP/base-gate-$unit.err"
              fi
              { echo "#### New in \`$unit\`, compared with the base"; echo; cat "$RUNNER_TEMP/new-$unit.md"; echo; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if (( ${#old[@]} )); then
            echo "#### Failing on the base already, not because of this change: ${old[*]}" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Failing on the base already, not because of this change: ${old[*]}"
          fi
          if (( ${#new[@]} )); then
            echo "::error::New failures in: ${new[*]}"
            exit 1
          fi
