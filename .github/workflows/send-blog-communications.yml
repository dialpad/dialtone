name: Send blog communications
on:
  workflow_dispatch:
    inputs:
      file_path:
        description: 'Path to the blog post markdown file (e.g., apps/dialtone-documentation/docs/about/whats-new/posts/2026-1-14.md)'
        required: true
        type: string
      test_email:
        description: 'Optional: Send to this email address instead of the production list (for testing)'
        required: false
        type: string
      channels:
        description: 'Which channels to send to'
        required: false
        type: choice
        default: 'all'
        options:
          - all
          - email
          - sms
  workflow_run:
    workflows: ["Deploy"]
    types:
      - completed
    branches:
      - production

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  added-posts:
    name: Get added posts
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      added_posts: ${{ steps.set-posts.outputs.posts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Get previous release SHA
        if: ${{ github.event_name == 'workflow_run' }}
        id: prev-release
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | grep -E "^dialtone/v[0-9]+\.[0-9]+\.[0-9]+$" | sed -n "2p")
          echo "sha=$(git rev-parse ${PREV_TAG})" >> "${GITHUB_OUTPUT}"

      - name: Get changed files (automatic)
        if: ${{ github.event_name == 'workflow_run' }}
        id: changed-files
        uses: tj-actions/changed-files@2f7c5bfce28377bc069a65ba478de0a74aa0ca32
        with:
          files: 'apps/dialtone-documentation/docs/about/whats-new/posts/*.md'
          json: true
          escape_json: false
          sha: ${{ github.event.workflow_run.head_sha }}
          base_sha: ${{ steps.prev-release.outputs.sha }}

      - name: Set posts output
        id: set-posts
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "posts=[\"${{ github.event.inputs.file_path }}\"]" >> $GITHUB_OUTPUT
          else
            echo "posts=${{ steps.changed-files.outputs.added_files }}" >> $GITHUB_OUTPUT
          fi

      - name: List all added posts
        run: echo '${{ steps.set-posts.outputs.posts }}'

  send-email:
    name: Send email
    runs-on: ubuntu-latest
    if: ${{ needs.added-posts.outputs.added_posts != '[]' && needs.added-posts.outputs.added_posts != '' && (github.event_name != 'workflow_dispatch' || github.event.inputs.channels != 'sms') }}
    permissions:
      contents: read
      id-token: write
    needs: [added-posts]
    strategy:
      matrix:
        files: ${{ fromJSON(needs.added-posts.outputs.added_posts) }}
    env:
      TO_MAIL: ${{ github.event.inputs.test_email || 'dialtone-users@dialpad.com' }}
      FILE_PATH: ${{ matrix.files }}
      API_URL: https://us-central1-dp-dialtone-design-system.cloudfunctions.net/send-email
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Get link from file name
        id: get-post-url
        run: |
          PREFIX="https:\/\/dialtone.dialpad.com"
          echo "POST_URL=$(echo $FILE_PATH | sed -e "s/apps\/dialtone-documentation\/docs/$PREFIX/" -e 's/md/html/')" >> $GITHUB_ENV

      - name: Get heading from blog post
        id: get-heading
        run: |
          echo "BLOG_POST_HEADING=$(sed -n 's/^heading: *//p' $FILE_PATH)" >> $GITHUB_ENV

      # This will do the following:
      # - Remove frontmatter.
      # - Remove script setup.
      # - Remove blog post component.
      # - Remove comments.
      # - Remove empty lines at the beginning of the file.
      # - Replace links paths for their absolute paths (prefixed by https://dialtone.dialpad.com).
      # - Ellipsis the article to the first 10 lines.
      # - Append the URL of the article at the end of the article.
      # - Store the result in MESSAGE_BODY env variable (jq will handle JSON escaping)
      - name: Process Markdown file
        run: |
          sed -i -E \
          -e '/^---$/,/^---$/d' \
          -e '/^<script setup>$/,/^<\/script>$/d' \
          -e '/^<\/*BlogPost.*$/d' \
          -e '/^<!--.*$/d' \
          -e '/./,$!d' \
          -e 's_(\[.*\])\(([^)]+)\)_\1(https://dialtone.dialpad.com\2)_g' \
          $FILE_PATH;
          sed -i -e '10q' $FILE_PATH;
          echo -e "\n... Read the full article: $POST_URL" >> $FILE_PATH;
          {
            echo 'MESSAGE_BODY<<EOF'
            cat $FILE_PATH
            echo
            echo EOF
          } >> $GITHUB_ENV;

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DIALTONE_GCP_WIP }}
          service_account: ${{ secrets.DIALTONE_GCP_SA }}
          token_format: "id_token"
          id_token_audience: ${{ env.API_URL }}

      - name: Send email
        run: |
          jq -n \
            --arg to "${{ env.TO_MAIL }}" \
            --arg subject "[dialtone] New blog post: ${{ env.BLOG_POST_HEADING }}" \
            --rawfile message "$FILE_PATH" \
            '{to: $to, subject: $subject, message: $message}' | \
          curl -m 70 -X POST ${{ env.API_URL }} \
            -H "Authorization: bearer ${{ steps.auth.outputs.id_token }}" \
            -H "Content-Type: application/json" \
            -d @-

  send-sms:
    name: Send SMS
    runs-on: ubuntu-latest
    if: ${{ (needs.added-posts.outputs.added_posts != '[]' && needs.added-posts.outputs.added_posts != '') && (github.event.inputs.test_email == '' || github.event_name != 'workflow_dispatch') && (github.event_name != 'workflow_dispatch' || github.event.inputs.channels != 'email') }}
    permissions:
      contents: read
      id-token: write
    needs: [ added-posts ]
    strategy:
      matrix:
        files: ${{ fromJSON(needs.added-posts.outputs.added_posts) }}
    env:
      FILE_PATH: ${{ matrix.files }}
      API_URL: https://us-central1-dp-dialtone-design-system.cloudfunctions.net/send-sms-to-dialtone-channel
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_sha }}

      - name: Get link from file name
        id: get-post-url
        run: |
          PREFIX="https:\/\/dialtone.dialpad.com"
          echo "POST_URL=$(echo $FILE_PATH | sed -e "s/apps\/dialtone-documentation\/docs/$PREFIX/" -e 's/md/html/')" >> $GITHUB_ENV

      - name: Get heading from blog post
        id: get-heading
        run: |
          echo "BLOG_POST_HEADING=$(sed -n 's/^heading: *//p' $FILE_PATH)" >> $GITHUB_ENV

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.DIALTONE_GCP_WIP }}
          service_account: ${{ secrets.DIALTONE_GCP_SA }}
          token_format: "id_token"
          id_token_audience: ${{ env.API_URL }}

      - name: Send sms
        run: |
          jq -n \
            --arg message "New blog post: ${{ env.BLOG_POST_HEADING }}. Read full article: ${{ env.POST_URL }}" \
            '{message: $message}' | \
          curl -m 70 -X POST ${{ env.API_URL }} \
            -H "Authorization: bearer ${{ steps.auth.outputs.id_token }}" \
            -H "Content-Type: application/json" \
            -d @-
