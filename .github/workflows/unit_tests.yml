name: Unit Tests

on:
  pull_request:
    paths:
      - 'packages/dialtone-vue3/**'
      - 'packages/dialtone-vue2/**'
  push:
    branches:
      - staging
    paths:
      - 'packages/dialtone-vue3/**'
      - 'packages/dialtone-vue2/**'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-vue2 tests with coverage
        run: pnpm nx run dialtone-vue2:test:coverage

      - name: Run dialtone-vue3 tests with coverage
        run: pnpm nx run dialtone-vue3:test:coverage
