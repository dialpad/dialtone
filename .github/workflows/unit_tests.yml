name: Unit Tests

on:
  pull_request:
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-mcp-server/**'
      - '.github/workflows/unit_tests.yml'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-docs/**'
      - 'packages/dialtone-css/**'
      - 'packages/dialtone-icons/**'
      - 'apps/dialtone-documentation/docs/components/**'
      - 'apps/dialtone-documentation/docs/.vuepress/site-reference.js'
      - 'apps/dialtone-documentation/scripts/lib/frontmatter.mjs'
      - 'apps/dialtone-documentation/scripts/lib/source-page.mjs'
      - 'scripts/lib/vue-component-identity.mjs'
  push:
    branches:
      - staging
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-mcp-server/**'
      - '.github/workflows/unit_tests.yml'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-docs/**'
      - 'packages/dialtone-css/**'
      - 'packages/dialtone-icons/**'
      - 'apps/dialtone-documentation/docs/components/**'
      - 'apps/dialtone-documentation/docs/.vuepress/site-reference.js'
      - 'apps/dialtone-documentation/scripts/lib/frontmatter.mjs'
      - 'apps/dialtone-documentation/scripts/lib/source-page.mjs'
      - 'scripts/lib/vue-component-identity.mjs'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      vue: ${{ steps.filter.outputs.vue }}
      tokens: ${{ steps.filter.outputs.tokens }}
      combinator: ${{ steps.filter.outputs.combinator }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vue:
              - 'packages/dialtone-vue/**'
            tokens:
              - 'packages/dialtone-tokens/**'
            combinator:
              - 'packages/combinator/**'
            # Lookup adapters and sources for their bundled datasets.
            cli:
              - 'packages/dialtone-query-core/**'
              - 'packages/dialtone-cli/**'
              - 'packages/dialtone-mcp-server/**'
              - 'packages/dialtone-docs/**'
              - 'packages/dialtone-css/**'
              - 'packages/dialtone-icons/**'
              - 'packages/dialtone-vue/**'
              - 'packages/dialtone-tokens/**'
              - '.github/workflows/unit_tests.yml'
              - 'scripts/build-dialtone-vue-docs.mjs'
              - 'scripts/lib/vue-component-identity.mjs'
              - 'apps/dialtone-documentation/docs/components/**'
              - 'apps/dialtone-documentation/docs/.vuepress/site-reference.js'
              - 'apps/dialtone-documentation/scripts/lib/frontmatter.mjs'
              - 'apps/dialtone-documentation/scripts/lib/source-page.mjs'

  test:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-vue tests with coverage
        run: pnpm nx run dialtone-vue:test:coverage

  test-tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-tokens tests
        run: pnpm nx run dialtone-tokens:test

  test-combinator:
    needs: changes
    if: needs.changes.outputs.combinator == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-combinator tests
        run: pnpm nx run dialtone-combinator:test

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Build lookup adapters and their datasets
        run: pnpm nx run-many -t build -p dialtone-cli dialtone-mcp-server

      - name: Run dialtone-query-core and dialtone-cli tests
        run: pnpm nx run-many -t test -p dialtone-query-core dialtone-cli

      - name: Test source-derived component documentation links
        run: pnpm --dir packages/dialtone-docs test

      - name: Test MCP query protocol contracts
        run: pnpm --dir packages/dialtone-mcp-server test:protocol

      - name: Build and test MCP startup and shutdown
        run: pnpm nx run dialtone-mcp-server:test-startup

      - name: Test shared-core release selection
        run: pnpm --dir packages/dialtone-mcp-server test:release-paths
