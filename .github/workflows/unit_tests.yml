name: Unit Tests

on:
  pull_request:
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-css/lib/build/js/dialtone_migration_helper/**'
      - 'packages/dialtone-css/lib/build/less/utilities/flex.less'
      - 'packages/dialtone-css/postcss/**'
      - 'packages/eslint-plugin-dialtone/**'
      - 'packages/stylelint-plugin-dialtone/**'
      - 'scripts/generate-migration-guidance.mjs'
      - 'scripts/tests/dialtone-recommendations.test.mjs'
      - '.github/workflows/unit_tests.yml'
      - 'apps/dialtone-documentation/docs/guides/mcp-server/index.md'
      - 'packages/dialtone-mcp-server/client-rules.json'
      - '.agents/resources/rules/css-utilities.md'
      - '.claude/rules/css-utilities.md'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-docs/src/generators/**'
  push:
    branches:
      - staging
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-css/lib/build/js/dialtone_migration_helper/**'
      - 'packages/dialtone-css/lib/build/less/utilities/flex.less'
      - 'packages/dialtone-css/postcss/**'
      - 'packages/eslint-plugin-dialtone/**'
      - 'packages/stylelint-plugin-dialtone/**'
      - 'scripts/generate-migration-guidance.mjs'
      - 'scripts/tests/dialtone-recommendations.test.mjs'
      - '.github/workflows/unit_tests.yml'
      - 'apps/dialtone-documentation/docs/guides/mcp-server/index.md'
      - 'packages/dialtone-mcp-server/client-rules.json'
      - '.agents/resources/rules/css-utilities.md'
      - '.claude/rules/css-utilities.md'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-docs/src/generators/**'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      vue: ${{ steps.filter.outputs.vue }}
      tokens: ${{ steps.filter.outputs.tokens }}
      combinator: ${{ steps.filter.outputs.combinator }}
      cli: ${{ steps.filter.outputs.cli }}
      lint_plugins: ${{ steps.filter.outputs.lint_plugins }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vue:
              - 'packages/dialtone-vue/**'
            tokens:
              - 'packages/dialtone-tokens/**'
            combinator:
              - 'packages/combinator/**'
            # The CLI and query-core, plus the scripts that generate the data files they read.
            cli:
              - 'packages/dialtone-query-core/**'
              - 'scripts/tests/dialtone-recommendations.test.mjs'
              - 'packages/dialtone-cli/**'
              - 'packages/dialtone-css/lib/build/js/dialtone_migration_helper/**'
              - 'packages/dialtone-css/lib/build/less/utilities/flex.less'
              - 'packages/dialtone-css/postcss/**'
              - 'packages/dialtone-tokens/build-docs.js'
              - '.github/workflows/unit_tests.yml'
              - 'apps/dialtone-documentation/docs/guides/mcp-server/index.md'
              - 'packages/dialtone-mcp-server/client-rules.json'
              - '.agents/resources/rules/css-utilities.md'
              - '.claude/rules/css-utilities.md'
              - 'scripts/build-dialtone-vue-docs.mjs'
              - 'packages/dialtone-docs/src/generators/**'
            lint_plugins:
              - 'packages/eslint-plugin-dialtone/**'
              - 'packages/stylelint-plugin-dialtone/**'
              - 'packages/dialtone-css/lib/build/js/dialtone_migration_helper/**'
              - 'packages/dialtone-css/lib/build/less/utilities/flex.less'
              - 'scripts/generate-migration-guidance.mjs'
              - '.github/workflows/unit_tests.yml'

  test:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-vue tests with coverage
        run: pnpm nx run dialtone-vue:test:coverage

  test-tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-tokens tests
        run: pnpm nx run dialtone-tokens:test

  test-combinator:
    needs: changes
    if: needs.changes.outputs.combinator == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-combinator tests
        run: pnpm nx run dialtone-combinator:test

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-query-core and dialtone-cli tests
        run: pnpm nx run-many -t test -p dialtone-query-core dialtone-cli

      - name: Test generated utility metadata and recommendations
        run: >-
          node --test
          scripts/tests/dialtone-recommendations.test.mjs
          packages/dialtone-css/postcss/dialtone-docs.test.cjs

  test-lint-plugins:
    needs: changes
    if: needs.changes.outputs.lint_plugins == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Check generated migration guidance
        run: node scripts/generate-migration-guidance.mjs --check

      - name: Test Dialtone ESLint rules
        run: pnpm --dir packages/eslint-plugin-dialtone test

      - name: Test Dialtone Stylelint rules
        run: pnpm --dir packages/stylelint-plugin-dialtone test
