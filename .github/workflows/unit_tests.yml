name: Unit Tests

on:
  pull_request:
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-mcp-server/**'
      - 'packages/dialtone-css/**'
      - 'packages/dialtone-icons/**'
      - 'packages/dialtone-docs/**'
      - 'packages/eslint-plugin-dialtone/**'
      - 'apps/dialtone-documentation/docs/**/*.md'
      - 'scripts/retrieval/**'
      - 'scripts/tests/**'
      - 'scripts/lib/**/*.mjs'
      - 'common/utils/server.mjs'
      - '.github/workflows/unit_tests.yml'
      - 'scripts/build-dialtone-vue-docs.mjs'
  push:
    branches:
      - staging
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'packages/dialtone-mcp-server/**'
      - 'packages/dialtone-css/**'
      - 'packages/dialtone-icons/**'
      - 'packages/dialtone-docs/**'
      - 'packages/eslint-plugin-dialtone/**'
      - 'apps/dialtone-documentation/docs/**/*.md'
      - 'scripts/retrieval/**'
      - 'scripts/tests/**'
      - 'scripts/lib/**/*.mjs'
      - 'common/utils/server.mjs'
      - '.github/workflows/unit_tests.yml'
      - 'scripts/build-dialtone-vue-docs.mjs'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      vue: ${{ steps.filter.outputs.vue }}
      tokens: ${{ steps.filter.outputs.tokens }}
      combinator: ${{ steps.filter.outputs.combinator }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vue:
              - 'packages/dialtone-vue/**'
            tokens:
              - 'packages/dialtone-tokens/**'
            combinator:
              - 'packages/combinator/**'
            # Lookup adapters, their source datasets/generators, and the shared retrieval fixtures.
            cli:
              - 'packages/dialtone-query-core/**'
              - 'packages/dialtone-cli/**'
              - 'packages/dialtone-mcp-server/**'
              - 'packages/dialtone-css/**'
              - 'packages/dialtone-icons/**'
              - 'packages/dialtone-docs/**'
              - 'packages/eslint-plugin-dialtone/**'
              - 'apps/dialtone-documentation/docs/**/*.md'
              - 'scripts/retrieval/**'
              - 'scripts/tests/**'
              - 'scripts/lib/**/*.mjs'
              - 'common/utils/server.mjs'
              - '.github/workflows/unit_tests.yml'
              - 'packages/dialtone-tokens/**'
              - 'packages/dialtone-vue/**'
              - 'scripts/build-dialtone-vue-docs.mjs'

  test:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-vue tests with coverage
        run: pnpm nx run dialtone-vue:test:coverage

  test-tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-tokens tests
        run: pnpm nx run dialtone-tokens:test

  test-combinator:
    needs: changes
    if: needs.changes.outputs.combinator == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-combinator tests
        run: pnpm nx run dialtone-combinator:test

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Build lookup adapters and source datasets
        run: pnpm nx run-many -t build -p dialtone-cli dialtone-mcp-server

      - name: Run query-core, CLI, documentation and ESLint suites
        run: |
          pnpm --dir packages/dialtone-query-core test
          pnpm --dir packages/dialtone-cli test
          pnpm --dir packages/dialtone-docs test
          pnpm --dir packages/eslint-plugin-dialtone test

      - name: Run shared fixture and cache contracts
        run: node --test scripts/retrieval/*.test.mjs

      - name: Run bounded cross-adapter retrieval regressions
        run: node scripts/retrieval/run.mjs

      - name: Run existing documentation search scenarios
        run: node packages/dialtone-mcp-server/scripts/run-acceptance-scenarios.mjs
