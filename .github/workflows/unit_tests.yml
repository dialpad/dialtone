name: Unit Tests

on:
  pull_request:
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-css/postcss/dialtone-docs.cjs'
      - 'packages/dialtone-docs/src/generators/**'
  push:
    branches:
      - staging
    paths:
      - 'packages/dialtone-vue/**'
      - 'packages/dialtone-tokens/**'
      - 'packages/combinator/**'
      - 'packages/dialtone-query-core/**'
      - 'packages/dialtone-cli/**'
      - 'scripts/build-dialtone-vue-docs.mjs'
      - 'packages/dialtone-css/postcss/dialtone-docs.cjs'
      - 'packages/dialtone-docs/src/generators/**'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      vue: ${{ steps.filter.outputs.vue }}
      tokens: ${{ steps.filter.outputs.tokens }}
      combinator: ${{ steps.filter.outputs.combinator }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vue:
              - 'packages/dialtone-vue/**'
            tokens:
              - 'packages/dialtone-tokens/**'
            combinator:
              - 'packages/combinator/**'
            # The CLI and query-core, plus the scripts that generate the data files they read.
            cli:
              - 'packages/dialtone-query-core/**'
              - 'packages/dialtone-cli/**'
              - 'packages/dialtone-vue/directives/**/*.mdx'
              - 'scripts/build-dialtone-vue-docs.mjs'
              - 'packages/dialtone-css/postcss/dialtone-docs.cjs'
              - 'packages/dialtone-docs/src/generators/**'

  test:
    needs: changes
    if: needs.changes.outputs.vue == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-vue tests with coverage
        run: pnpm nx run dialtone-vue:test:coverage

  test-tokens:
    needs: changes
    if: needs.changes.outputs.tokens == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-tokens tests
        run: pnpm nx run dialtone-tokens:test

  test-combinator:
    needs: changes
    if: needs.changes.outputs.combinator == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-combinator tests
        run: pnpm nx run dialtone-combinator:test

  test-cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Run dialtone-query-core and dialtone-cli tests
        run: pnpm nx run-many -t test -p dialtone-query-core dialtone-cli
