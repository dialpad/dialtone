name: Release packages

on:
  workflow_dispatch:
    inputs:
      package:
        type: 'choice'
        required: true
        description: 'Select a package to run the release'
        options:
          - all
          - dialtone
          - combinator
          - css
          - emojis
          - icons
          - language-server
          - tokens
          - vue
          - eslint-plugin
          - stylelint-plugin
          - postcss-responsive-variations
          - dialtone-mcp-server
          - dialtone-cli
  schedule:
    - cron: "0 10 * * 2"

permissions:
  packages: read

env:
  HUSKY: 0

jobs:
  get-branch-name:
    runs-on: ubuntu-latest
    outputs:
      current_branch: ${{ steps.branch-name.outputs.current_branch }}
    steps:
      - name: Get branch name
        id: branch-name
        uses: tj-actions/branch-names@v8

  # check-dialpad-member:
  #   runs-on: ubuntu-latest
  #   steps:
  #     # Will prevent the rest of the steps from running on fail
  #     - name: Check if user is a dialpad member
  #       uses: octokit/request-action@v2.x
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.DIALTONE_CI_TOKEN }}
  #       with:
  #         route: GET /orgs/dialpad/members/${{ github.actor }}

  release:
    needs: [get-branch-name]
    if: ${{ contains(fromJSON('["staging", "alpha", "beta", "next"]'), needs.get-branch-name.outputs.current_branch) }}
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.release-base.outputs.base_sha }}
      release_sha: ${{ steps.release-final.outputs.release_sha }}
    permissions:
      actions: read
      contents: write
      packages: write
      issues: write
      pull-requests: write
    env:
      RELEASE_TAG: ${{ needs.get-branch-name.outputs.current_branch == 'staging' && 'latest' || needs.get-branch-name.outputs.current_branch }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DIALTONE_CI_TOKEN }}

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Record release base
        id: release-base
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_BRANCH: ${{ needs.get-branch-name.outputs.current_branch }}
        run: |
          base_sha=$(git rev-parse HEAD)
          if [[ "$RELEASE_BRANCH" =~ ^(alpha|beta|next)$ ]]; then
            [[ "$base_sha" == "$(git rev-parse "origin/$RELEASE_BRANCH")" ]] || {
              echo "::error::Preparation source is stale; start a new release run on the current branch."
              exit 1
            }
            gh api --method GET "repos/$GH_REPO/actions/workflows/release.yml/runs" \
              -f "branch=$RELEASE_BRANCH" -F per_page=100 --paginate --slurp > "$RUNNER_TEMP/release-runs.json" || exit 1
            base_sha=$(node <<'NODE'
          const { readFileSync } = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const runs = JSON.parse(readFileSync(process.env.RUNNER_TEMP + '/release-runs.json'))
            .flatMap(page => page.workflow_runs).sort((a, b) => b.id - a.id);
          const current = Number(process.env.GITHUB_RUN_ID);
          let base = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          let unfinished = false;
          let boundary = false;
          for (const run of runs) {
            if (run.id === current) continue;
            if (run.id > current || run.status !== 'completed')
              throw new Error('Another preparation run exists; finish the latest run before preparing again');
            if (run.conclusion === 'success') { boundary = true; break; }
            const jobs = JSON.parse(execFileSync('gh', ['api', '--method', 'GET',
              `repos/${process.env.GH_REPO}/actions/runs/${run.id}/jobs`,
              '-f', 'filter=all', '-F', 'per_page=100', '--paginate', '--slurp'], { encoding: 'utf8' }))
              .flatMap(page => page.jobs);
            if (!jobs.length) throw new Error('Preparation job history is unavailable; inspect the unfinished release before retrying');
            const preparations = jobs.filter(job => job.name === 'release');
            const guards = preparations.flatMap(job => job.steps ?? []).filter(step => step.name === 'Record release base');
            if (preparations.length && !guards.length)
              throw new Error('Preparation guard history is unavailable; inspect the unfinished release before retrying');
            if (!guards.some(step => step.conclusion === 'success')) continue;
            unfinished = true;
            base = run.head_sha;
          }
          if (unfinished && !boundary)
            throw new Error('Preparation history has no successful boundary; inspect the unfinished release before retrying');
          if (!/^[0-9a-f]{40}$/.test(base)) throw new Error('Invalid preparation base');
          console.log(base);
          NODE
            ) || exit 1
          fi
          git merge-base --is-ancestor "$base_sha" HEAD || exit 1
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      # Release to GitHub
      - name: Release Dialtone Combinator ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'combinator' }}
        run: pnpm nx run dialtone-combinator:release

      - name: Release Dialtone CSS ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'css' }}
        run: pnpm nx run dialtone-css:release

      - name: Release Dialtone Emojis ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'emojis' }}
        run: pnpm nx run dialtone-emojis:release

      - name: Release Dialtone Icons ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'icons' }}
        run: pnpm nx run dialtone-icons:release

      - name: Release Dialtone Language server ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'language-server' }}
        run: pnpm nx run dialtone-language-server:release

      - name: Release Dialtone Tokens ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'tokens' }}
        run: pnpm nx run dialtone-tokens:release

      - name: Release Dialtone Vue ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'vue' }}
        run: pnpm nx run dialtone-vue:release

      - name: Release Dialtone ESLint Plugin ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'eslint-plugin' }}
        run: pnpm nx run eslint-plugin-dialtone:release

      - name: Release Dialtone StyleLint Plugin ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'stylelint-plugin' }}
        run: pnpm nx run stylelint-plugin-dialtone:release

      - name: Release Dialtone PostCSS Responsive Variations Plugin ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'postcss-responsive-variations' }}
        run: pnpm nx run postcss-responsive-variations:release

      - name: Release Dialtone MCP Server ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'dialtone-mcp-server' }}
        run: pnpm nx run dialtone-mcp-server:release

      - name: Release Dialtone CLI ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'dialtone-cli' }}
        run: pnpm nx run dialtone-cli:release

      - name: Release Dialtone ${{ env.RELEASE_TAG }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.package == 'all' || github.event.inputs.package == 'dialtone' }}
        run: pnpm nx run dialtone:release

      - name: Record prepared release commit
        id: release-final
        run: echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Individual semantic-release pushes are incomplete version sets on prerelease branches.
  publish-prerelease:
    needs: [get-branch-name, release]
    if: ${{ contains(fromJSON('["alpha", "beta", "next"]'), needs.get-branch-name.outputs.current_branch) && needs.release.outputs.base_sha != needs.release.outputs.release_sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # A top-level dispatch keeps publish-web.yml as the existing npm trusted-publisher identity.
      - name: Dispatch prepared prerelease publication
        env:
          GH_TOKEN: ${{ secrets.DIALTONE_CI_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          RELEASE_BASE: ${{ needs.release.outputs.base_sha }}
          RELEASE_BRANCH: ${{ needs.get-branch-name.outputs.current_branch }}
        run: >
          gh workflow run publish-web.yml --ref "$RELEASE_BRANCH"
          --field "release_sha=$RELEASE_SHA"
          --field "release_base=$RELEASE_BASE"
          --field "release_branch=$RELEASE_BRANCH"

  update-production:
    needs: [ release ]
    if: ${{ needs.get-branch-name.outputs.current_branch == 'staging' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 'production'
          fetch-depth: 0
          token: ${{ secrets.DIALTONE_CI_TOKEN }}

      - name: Merge changes to production
        run: |
          git merge --ff-only origin/staging
          git push
