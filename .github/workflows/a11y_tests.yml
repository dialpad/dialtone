name: Accessibility Tests

on:
  push:
    branches:
      - staging
      - production

    paths:
      - 'packages/dialtone-vue2/**'
      - 'packages/dialtone-vue3/**'

  pull_request:
    types:
      - opened
      - synchronize

    paths:
      - 'packages/dialtone-vue2/**'
      - 'packages/dialtone-vue3/**'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  filter-actions:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      dialtone-vue-2: ${{ steps.filter.outputs.dialtone-vue-2 }}
      dialtone-vue-3: ${{ steps.filter.outputs.dialtone-vue-3 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter actions by path
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dialtone-vue-2:
              - 'packages/dialtone-vue2/**'
            dialtone-vue-3:
              - 'packages/dialtone-vue3/**'


  dialtone-vue-2:
    needs: filter-actions
    if: ${{ needs.filter-actions.outputs.dialtone-vue-2 == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "dialpad"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run a11y tests
        run: pnpm nx run dialtone-vue2:test:a11y

  dialtone-vue-3:
    needs: filter-actions
    if: ${{ needs.filter-actions.outputs.dialtone-vue-3 == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use pnpm
        uses: pnpm/action-setup@v3

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"
          scope: "dialpad"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run a11y tests
        run: pnpm nx run dialtone-vue3:test:a11y
