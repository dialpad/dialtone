name: Accessibility Tests

on:
  push:
    branches:
      - staging
      - production

    paths:
      - 'packages/dialtone-vue/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/actions/setup-environment/**'
      - '.github/workflows/a11y_tests.yml'

  pull_request:
    types:
      - opened
      - synchronize

    paths:
      - 'packages/dialtone-vue/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/actions/setup-environment/**'
      - '.github/workflows/a11y_tests.yml'

env:
  HUSKY: 0

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  dialtone-vue:
    runs-on: ubuntu-26.04
    permissions:
      packages: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Setup Environment
        uses: ./.github/actions/setup-environment

      - name: Report browser test environment
        run: |
          cat /etc/os-release
          node --version
          pnpm --version
          pnpm exec playwright --version
          pnpm --filter @dialpad/dialtone-vue list @storybook/test-runner playwright playwright-core --depth 2

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run a11y tests
        run: pnpm nx run dialtone-vue:test:a11y
