<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=400">
  <title>Thumb Harness</title>
  <style>
    /* Layout only — let dialtone-css handle ALL typography, colors, and component styles. */
    html, body {
      inline-size: 400px; /* capture-frame width, intentionally custom */
      block-size: 225px;  /* capture-frame height, intentionally custom */
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
    }
    #thumb-root {
      inline-size: 400px;
      block-size: 225px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--dt-spacing-200);
    }
    /* Preview-only frame outline — shown in `vite serve` so the author can see
       the 400×225 viewport boundary. Removed by the generator (which adds
       `.thumb-capturing` to body) so the captured PNG stays clean. */
    body:not(.thumb-capturing) #thumb-root {
      outline: var(--dt-size-border-100) dashed var(--dt-color-border-subtle);
      outline-offset: calc(-1 * var(--dt-size-border-100));
    }

    /* Suppress focus rings in captured screenshots. dialtone-css lives in
       `@layer dialtone.components`, where an unlayered `!important` rule
       loses to a layered `!important` rule — neutralizing the underlying
       focus tokens bypasses the cascade entirely.
       Scope: `--dt-shadow-focus` (button focus rings) and input-only tokens.
       Avoid touching `--dt-color-border-focus` / `--dt-size-border-focus`
       directly because components like DtResizableHandle legitimately style
       themselves with `--dt-color-border-focus` as an accent — overriding it
       here would erase intentional UI, not just unwanted focus state. The
       blur + tippy-hide pre-capture cleanup handles those cases instead. */
    body.thumb-capturing {
      --dt-shadow-focus: none;
      --dt-inputs-color-background-focus: transparent;
      --dt-inputs-color-border-focus: transparent;
    }
    body.thumb-capturing :focus,
    body.thumb-capturing :focus-visible,
    body.thumb-capturing :focus-within {
      outline: none !important;
      box-shadow: none !important;
    }

    /* Picker / gallery mode — release the 400×225 viewport so the list (or
       grid of all thumbs) can flow naturally. The :has() selectors reach
       <html> so it loses its overflow:hidden and 400px inline-size too;
       without that the page can't scroll and the grid is pinned to 400px.
       Never reached during capture. */
    html:has(body.picker-mode),
    html:has(body.gallery-mode),
    body.picker-mode,
    body.gallery-mode {
      inline-size: auto;
      block-size: auto;
      overflow: auto;
    }
    body.picker-mode #thumb-root,
    body.gallery-mode #thumb-root {
      inline-size: auto;
      block-size: auto;
      display: block;
      padding: var(--dt-spacing-300);
      outline: none;
    }
    .gallery {
      /* max-inline-size: 96rem; */
      margin: 0 auto;
    }
    .gallery h1 {
      margin: 0 0 var(--dt-spacing-100);
      font-size: var(--dt-font-size-300);
    }
    .gallery > p {
      margin: 0 0 var(--dt-spacing-200);
      color: var(--dt-color-foreground-secondary);
    }
    .gallery__grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: var(--dt-spacing-200);
    }
    .gallery__cell {
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--dt-spacing-50);
      text-decoration: none;
      color: inherit;
      border-radius: var(--dt-size-radius-200);
      transition: background-color 120ms ease;
    }
    .gallery__cell:hover {
      background: var(--dt-color-surface-secondary);
    }
    .gallery__cell:hover .gallery__img {
      border-color: var(--dt-color-border-default);
    }
    .gallery__img {
      inline-size: 100%;
      aspect-ratio: 400 / 225;
      object-fit: contain;
      background: var(--dt-color-surface-secondary);
      border-radius: var(--dt-size-radius-200);
      border: var(--dt-size-border-100) solid var(--dt-color-border-subtle);
    }
    .gallery__caption {
      font-family: var(--dt-font-family-mono);
      font-size: var(--dt-font-size-100);
      color: var(--dt-color-foreground-tertiary);
      text-align: center;
    }
    .picker {
      max-inline-size: 72rem; /* ~720px, picker-specific layout width */
    }
    .picker h1 {
      margin: 0 0 var(--dt-spacing-100);
      font-size: var(--dt-font-size-300);
    }
    .picker p {
      margin: 0 0 var(--dt-spacing-150);
      color: var(--dt-color-foreground-secondary);
    }
    .picker code {
      font-family: var(--dt-font-family-mono);
      padding: var(--dt-size-border-100) var(--dt-spacing-50);
      background: var(--dt-color-surface-secondary);
      border-radius: var(--dt-size-radius-200);
    }
    .picker__list {
      list-style: none;
      padding: 0;
      margin: var(--dt-spacing-200) 0 0;
      columns: 2;
      column-gap: var(--dt-spacing-300);
    }
    .picker__list li {
      padding: var(--dt-spacing-50) 0;
      break-inside: avoid;
    }
    .picker__meta {
      color: var(--dt-color-foreground-tertiary);
      font-size: var(--dt-font-size-100);
    }
    .picker__badge {
      font-style: normal;
      padding: var(--dt-size-border-100) var(--dt-spacing-75);
      border-radius: var(--dt-size-radius-200);
      background: var(--dt-color-surface-info);
      color: var(--dt-color-foreground-on-info);
      font-size: var(--dt-font-size-100);
    }
  </style>
</head>
<body>
  <div id="thumb-root"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
