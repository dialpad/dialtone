# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Dialtone-specific overrides — inherits from dialpad/coderabbit/.coderabbit.yaml
inheritance: true

# Cross-repo context: CodeRabbit indexes these so it understands how Dialtone
# is consumed when reviewing PRs in this repo.
# Docs: https://docs.coderabbit.ai/integrations/knowledge-base
knowledge_base:
  linked_repositories:
    - repository: "dialpad/ios"
      instructions: "Dialpad iOS app that consumes Dialtone design tokens and icons for consistent UI across platforms."
    - repository: "dialpad/firespotter"
      instructions: "Primary Dialpad web app and the main consumer of @dialpad/dialtone-vue components and Dialtone CSS utilities."

reviews:
  # CODEOWNERS (.github/CODEOWNERS) already assigns the full team on every PR.
  # These rules supplement CODEOWNERS with area-specific expertise suggestions.
  # auto_assign_reviewers: false → suggest only, not assign (CODEOWNERS handles assignment).
  suggested_reviewers: true
  auto_assign_reviewers: false
  suggested_reviewers_instructions:
    - reviewers:
        - handle: "francisrupert"
          type: "user"
        - handle: "iropolo"
          type: "user"
      instructions: "Assign when the PR modifies Vue components or Storybook stories under packages/dialtone-vue/components/."
    - reviewers:
        - handle: "francisrupert"
          type: "user"
        - handle: "braddialpad"
          type: "user"
      instructions: "Assign when the PR modifies CSS utilities under packages/dialtone-css/ or design tokens under packages/dialtone-tokens/."
    - reviewers:
        - handle: "braddialpad"
          type: "user"
      instructions: "Assign when the PR modifies the documentation site under apps/dialtone-documentation/ or icons under packages/dialtone-icons/."
    - reviewers:
        - handle: "francisrupert"
          type: "user"
        - handle: "belumontoya"
          type: "user"
      instructions: "Assign when the PR modifies developer tooling: MCP server, language server, ESLint plugin, Stylelint plugin, or PostCSS plugin."
    - reviewers:
        - handle: "iropolo"
          type: "user"
        - handle: "braddialpad"
          type: "user"
      instructions: "Assign when the PR modifies CI workflows under .github/workflows/."

  # Controls which files CodeRabbit includes or excludes from review using glob patterns.
  # Patterns prefixed with ! exclude files from being commented on; unprefixed patterns include them.
  # Excluded files are still readable by CodeRabbit for context — they just won't receive review comments.
  # Docs: https://docs.coderabbit.ai/reference/configuration
  path_filters:
    - "**"
    - "!**/dist/**"
    - "!coverage/**"
    - "!.nx/**"
    - "!node_modules/**"
    - "!packages/dialtone-icons/src/icons/**"         # generated Vue components from SVG source
    - "!packages/dialtone-icons/src/illustrations/**" # generated
    - "!packages/dialtone-icons/android/src/**"       # generated Android resources
    - "!packages/dialtone-vue/storybook-static/**"    # Storybook build output
    - "!packages/dialtone-vue/functions/generated/**"

  path_instructions:
    # Vue components
    - path: 'packages/dialtone-vue/components/**'
      instructions: >
        This is a public npm design system library (@dialpad/dialtone-vue).
        Breaking changes silently ship as patches if not labeled with BREAKING CHANGE.

        - New components must use Composition API with <script setup lang="ts">.
          Existing components use Options API with compatConfig MODE 3 — do not convert.

        - Props must use `validator` (never `validate` — Vue silently ignores it).
          Import allowed values from *Constants.js or *Constants.ts.

        - Events: `update:modelValue` for v-model, `update:open` for new overlays.

        - Flag any prop/event/slot removal or rename without BREAKING CHANGE footer.

        - Flag raw hex/rgb values, hardcoded px, or inline z-index that should use
          --dt-color-*, --dt-space-*, --dt-size-*, --dt-z-index-*, --dt-radius-* tokens.

        - Boolean props: general booleans use is/has/show prefixes.
          Visibility toggles use positive showX names (showClose, showHeader).

        - Component styles must live in packages/dialtone-css, not inline.
          Templates should use Dialtone utility classes (d-*).

        - Assess the complete Component Artifact Pipeline in
          .agents/resources/rules/vue-components.md, including generated CLI/MCP
          lookup data, Combinator variants and component-wall thumbnails.

        - Accessibility: ARIA correctness, keyboard navigation, focus management
          in modals/overlays, screen reader announcements via aria-live.

        - New user-facing strings must use FTL localization keys
          (packages/dialtone-vue/localization). Flag hardcoded English.

        Follow the conventions in .agents/resources/rules/vue-components.md.

    # Vue tests
    - path: 'packages/dialtone-vue/**/*.test.js'
      instructions: >
        - Tests use Vitest + @vue/test-utils.

        - One assertion per test. Use beforeAll/beforeEach to reduce repetition.
          Use it.each for similar tests with different values.

        - Flag tests that assert on implementation details (mock call counts)
          instead of behavior (rendered output, emitted events).

        Follow the conventions in .claude/rules/vue-tests.md.

    # CSS utilities
    - path: 'packages/dialtone-css/**'
      instructions: >
        - All values must use var(--dt-*) custom properties. Flag any hardcoded
          raw values (px, hex, rgb).

        - Utility naming: d-<property-shorthand><value> (e.g., d-p8, d-d-flex).

        - Use flat CSS selectors. Follow BEM for component styles.

        - Responsive variants are generated by postcss-responsive-variations.
          Breakpoints: sm:480px, md:640px, lg:960px, xl:1264px.

        Follow the conventions in .claude/rules/css-utilities.md.

    # Design tokens
    - path: 'packages/dialtone-tokens/**'
      instructions: >
        - Token naming: camelCase with category prefix (dtColor*, dtSpace*,
          dtFontSize*, dtFontWeight*, dtShadow*, dtRadius*, dtSize*).

        - New tokens may inherit from default.json when the same value is correct
          in dark mode. Add a dark.json override only when the dark theme value
          must differ from the default.

        - Prefer semantic tokens when a suitable mapping exists, but direct
          base-palette references are valid when they are the correct source of
          truth (e.g., a token tied to a specific palette stop).

        - Flag any circular references or references to non-existent tokens.

        - New design tokens must be defined across all 8 themes (Dialpad Light/Dark,
          T-Mobile Light/Dark, Expressive Light/Dark, Expressive Small Light/Dark).

        Follow the conventions in .claude/rules/design-tokens.md.

    # Icons
    - path: 'packages/dialtone-icons/**'
      instructions: >
        - SVG icons are compiled into Vue components.

        - Flag icons with hardcoded colors — they should use currentColor
          for foreground so they inherit from the parent.

        - Icon sizes use numeric scale 100-800.

        Follow the conventions in .claude/rules/icons.md.

    # MCP server
    - path: 'packages/dialtone-mcp-server/**'
      instructions: >
        - The MCP server exposes Dialtone component, utility, and token data to
          Claude Code. Build is rollup -c only — no generated files.

        - Flag changes that alter the public tool interface (tool names, parameter
          schemas) without a corresponding update to the server version.

        Follow the conventions in .claude/rules/mcp-server.md.

    # AI docs package (documentation generation and validation)
    - path: 'packages/dialtone-docs/**'
      instructions: >
        - src/content/ holds AI-readable markdown docs — changes here affect
          what Claude Code and other AI tools know about Dialtone.

        - src/generators/ produces content from source packages — prefer
          regenerating over hand-editing generated output.

        - Flag content edits that describe APIs, props, or behavior that has
          since changed in the source packages (stale docs).

        Follow the writing conventions in .claude/rules/documentation-writing.md.

    # Query core (shared data layer for MCP server and language server)
    - path: 'packages/dialtone-query-core/**'
      instructions: >
        - data.ts is hand-written; the JSON files it imports
          (dialtone-docs.json, component-documentation.json, public-docs.json,
          tokens-docs.json, keywords-icons.json) are generated by their
          owning packages. Edit data.ts when adding a new data source.

        - Changes here affect both the MCP server and the language server
          which depend on this package.

        Follow the conventions in .claude/rules/dialtone-query-core.md.

    # CLI
    - path: 'packages/dialtone-cli/**'
      instructions: >
        - The CLI is a thin interface over dialtone-query-core. Search behavior
          changes belong in dialtone-query-core, not here.

        - Changes here should only touch argument parsing, output formatting,
          or the prompt command's LLM context generation.

        Follow the conventions in .claude/rules/dialtone-cli.md.

    # Combinator variants
    - path: 'packages/combinator/src/variants/**'
      instructions: >
        - Variant files drive Combinator presets, documentation examples, and
          component-wall thumbnail input.

        - Match component docgen member names exactly. Unknown prop, slot, or
          attribute names are ignored.

        - Use exclusions only for invalid or misleading combinations; simple
          parent-off child-disabled cases should come from component JSDoc when
          possible.

        - New variant files must be registered in
          packages/combinator/src/variants/variants.js.

        Follow the conventions in .claude/rules/combinator-variants.md.

    # ESLint plugin
    - path: 'packages/eslint-plugin-dialtone/**'
      instructions: >
        - Rules must be documented with correct, schema-validated options.

        - Each rule needs tests covering valid and invalid cases.

        - Flag new rules missing an entry in the plugin's recommended config.

        Follow the conventions in .claude/rules/eslint-plugin.md.

    # Stylelint plugin
    - path: 'packages/stylelint-plugin-dialtone/**'
      instructions: >
        - Rules must mirror the ESLint plugin conventions where applicable.

        - Each rule needs tests covering valid and invalid cases.

        Follow the conventions in .claude/rules/stylelint-plugin.md.

    # Figma styles sync (text/effect/paint styles — a dev plugin, not a script,
    # since Figma has no REST write endpoint for styles)
    - path: 'packages/figma-styles-sync/**'
      instructions: >
        - `src/` (the resolvers) has CI: lint, typecheck, and unit tests via
          `unit_tests.yml`'s `test-figma-styles-sync` job. A change there can be
          verified the normal way.
        - `plugin/` runs inside Figma's plugin sandbox and is a local dev plugin
          run by hand against a scratch Figma file — nothing in CI exercises it.
          A change there can't be verified by a type check or unit test alone;
          look for evidence it was actually run against the live file (e.g. in
          the PR description), not just that it compiles.

        - plugin/code.js is generated by esbuild from plugin/code.ts — never hand-edit
          it, and flag a diff touching code.js without a matching code.ts change.

        - Credentials (Figma PAT, file key) belong in a gitignored .env, never inline
          or in a commit. Flag any literal token/key.

    # Figma components sync (full component variant sets — browser-measured via CDP,
    # not a token lookup; see the package README's Status and Setup sections)
    - path: 'packages/figma-components-sync/**'
      instructions: >
        - Not in CI — needs a real browser, a Figma PAT, and a scratch file; changes
          can't be verified by a type check alone. Look for evidence a change was
          re-run through check-all.mjs/negative-control.mjs, not just that it parses.

        - sync-scripts/generic-builder.js, icon-builder.js, and slot-properties.js are
          fragments inlined into a generated plugin code.js by build-plugin.mjs — never
          hand-edit code.js, and a bare top-level `return` in these three is intentional,
          not a bug.

        - Don't suggest duplicating color.ts, token_*.ts, transform.ts, utils.ts, or
          figma_api.ts here — the real versions live in
          packages/dialtone-tokens/sync-scripts/. This package only loads resolve_tokens.ts
          and the built token CSS from that package, so there's no reason to add a second copy.

        - Credentials (Figma PAT, file key) belong in a gitignored .env, never inline
          or in a commit. Flag any literal token/key.

    # CI workflows
    - path: '.github/workflows/**'
      instructions: >
        - Flag any new permissions that aren't strictly needed.

        - Flag use of pull_request_target (security risk on public repo).

        - Flag secrets exposed to steps that don't need them.

        - This is a public repo — flag any hardcoded internal URLs or credentials.

    # Storybook
    - path: 'packages/dialtone-vue/**/*.stories.js'
      instructions: >
        - Each component must have argTypes for all public props.

        - New variants need their own Story.

        - Deprecated components/props need a badge in the story.

    # Documentation site
    - path: 'apps/dialtone-documentation/**'
      instructions: >
        - Component doc pages require: overview, usage example, variants,
          props table, events table, slots table, accessibility notes.

        - Sidebar navigation is in _data/site-nav.json — new pages must be added there.

        - This documentation site is not localized. Plain English is expected in Markdown
          and documentation-site Vue components. Do not request FTL keys or i18n wrappers here.

        Follow the conventions in .claude/rules/documentation-site.md.

    # General (all files)
    - path: '**/*'
      instructions: >
        - This is a public npm library. Breaking changes without BREAKING CHANGE
          footer ship as patches and silently break consumers.

        - Commit type must match impact: removals/renames need BREAKING CHANGE,
          new exports need feat, not fix.

        - Flag non-tree-shakeable imports at entry points and heavy dependencies
          added without justification.

        - Only dialtone-vue component strings are localized (FTL). Do not flag hardcoded
          English in documentation, READMEs, CLI or MCP output, or tooling.
